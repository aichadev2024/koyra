# Blueprint Render — VERSION GRATUITE (phase de test / démo).
# Doc : https://render.com/docs/blueprint-spec
#
# Limites du gratuit :
#   - le site s'endort après 15 min sans visite (réveil ~50 s)
#   - la base de données est SUPPRIMÉE au bout de 30 jours
#   - pas de disque persistant : les images uploadées sont perdues à chaque
#     redéploiement (les disques exigent un plan payant)
#
# >>> POUR PASSER EN PRODUCTION : voir les lignes marquées "PROD" ci-dessous.

databases:
  - name: koyra-db
    databaseName: koyra_db
    user: koyra
    plan: free                  # PROD : "basic-256mb" (~7 $/mois, pas d'expiration)
    region: frankfurt           # DOIT être la même région que le service web
                                # (sinon l'hôte interne dpg-... ne résout pas)

services:
  - type: web
    name: koyra
    runtime: python
    plan: free                  # PROD : "starter" (~7 $/mois, ne s'endort pas)
    region: frankfurt
    buildCommand: "./build.sh"
    # migrate ici (runtime) : la base n'est pas joignable pendant le build.
    startCommand: "python manage.py migrate --noinput && gunicorn koyra_web.wsgi:application"
    healthCheckPath: /

    # PROD : décommenter pour conserver les images uploadées (nécessite plan payant)
    # disk:
    #   name: koyra-media
    #   mountPath: /var/media
    #   sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true       # Render invente une clé aléatoire : rien à faire
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:             # Render relie automatiquement à koyra-db
          name: koyra-db
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # PROD : avec le disque, ajouter  { key: MEDIA_ROOT, value: "/var/media" }
      - key: SECURE_SSL_REDIRECT
        value: "true"

      # --- E-mail (Gmail) : à renseigner pendant l'Apply ou plus tard ---------
      # Laisser vide pour l'instant si le compte Gmail n'est pas prêt : le
      # formulaire de contact enregistre quand même les messages dans l'admin.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false               # adresse Gmail complète
      - key: EMAIL_HOST_PASSWORD
        sync: false               # mot de passe d'application (16 lettres)
      - key: DEFAULT_FROM_EMAIL
        sync: false               # ex. Koyra Distribution <...@gmail.com>
      - key: CONTACT_NOTIFICATION_EMAIL
        sync: false               # adresse qui reçoit les messages du formulaire

      # --- Page d'installation du 1er compte admin -------------------------
      # URL : /installation/<jeton>/ (active seulement tant qu'aucun admin
      # n'existe). À DÉFINIR à la main dans l'onglet Environment avec une
      # valeur URL-safe : lettres + chiffres uniquement, ~40 caractères
      # (ex.  openssl rand -hex 24  ou  python -c "import secrets;print(secrets.token_hex(24))").
      # NE PAS utiliser generateValue : Render produit du base64 (avec / + =)
      # qui casse l'URL.
      - key: ADMIN_SETUP_TOKEN
        sync: false

      # --- Stockage des images produits ---------------------------------
      # Indispensable sur le plan gratuit : le disque de Render est éphémère.
      # Choix retenu : Firebase Storage (bucket Google Cloud Storage). Voir
      # DEPLOIEMENT.md §6 pour créer le bucket + la clé de compte de service.
      - key: GS_BUCKET_NAME
        sync: false        # ex. koyra-xxxxx.firebasestorage.app
      - key: GS_CREDENTIALS_JSON
        sync: false        # contenu du fichier JSON du compte de service
      # Alternatives compatibles S3 (Backblaze B2, R2, Supabase…) :
      # S3_ENDPOINT_URL / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY /
      # S3_BUCKET_NAME / S3_REGION  — ou CLOUDINARY_URL.
